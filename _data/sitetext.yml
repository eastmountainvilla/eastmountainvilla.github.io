en: &DEFAULT_EN
  header:
    text: East Mountain Villa

  portfolio:
    title: "Galerija"
    text: "Stvorite uspomene o kojima ćete pričati godinama"
    section: portfolio

  timeline:
    title: "O KUĆI"
    text: "Mjesto gdje vrijeme sporije teče"
    section: timeline
    # left is the default
    #start_align: "left"
    events:
      - title: "Smještani kapactit kuće"
        desc: "East Mountain Villa može ugostiti do 7 osoba, te na raspolaganju ima i kretević za bebe. Kuća se sastoji od dvije spavaće sobe, dnevnog boravka, potpuno opremljene kuhinje, blagovaonice, vinskog podruma, kupaonice i toaleta. U sklopu ograđenog dvorišta nalazi se natkrivena terasa s pečenjara i velikim stolom za objedovanje, kao i hot tub grijan na drva."
        image: assets/img/timeline/1.jpg
        alt: Kuća za odmor nalazi se u Slavoniji i Baranji.
      - title: "Hot Tub grijan na drva"
        desc: "Poseban doživljaj i istinsko opuštanje pruža vanjska hidromasažna kada (jacuzzi/hot tub) grijana na drva, opremljena vodenim i zračnim mlaznicama te LED rasvjetom. Dovoljno je prostrana da u njoj istovremeno može uživati do 8 osoba."
        image: assets/img/timeline/2.jpg
        alt: Poseban doživljaj i istinski hedonizam pruža vanjski jacuzzi.
      - title: "Vinski podrum - Gator"
        desc: "Opuštajući ambijent očekuje Vas i unutar kuće, gdje se skriva tradicionalni vinski podrum – gator. Uživanje u dobrom društvu i dobroj kapljici, dobiva novu dimenziju zbog jedinstvenog ugođaja ovih podruma."
        image: assets/img/timeline/3.jpg
        alt: Opuštajući ambijent očekuje Vas i unutar kuće.
      - title: "Natkrivena terasa"
        desc: "Prostrana natkrivena terasa idealno je mjesto za druženje na svježem zraku. Vrsni kuhari među Vama biti će zadovoljni s velikom pečenjarom, kao i opremom za razne gastroavanture: pribor za roštilj, kotlić, peka i ražanj."
        image: assets/img/timeline/4.jpg
        alt: Prostrana natkrivena terasa idealno je mjesto za druženje na svježem zraku.
        # you can enforce the alignment
        align: right
    end: "<br>Dobro došli!"

  about:
    title: "Dobro došli"
    body: "**Dobro došli u East Mountain Villu – mjesto gdje vrijeme teče sporije.**<br /><br />Smještena među vinogradima i zelenim obroncima Baranje, East Mountain Villa privatno je utočište za goste koji žele usporiti, ponovno se povezati s prirodom i doživjeti Baranju na autentičan način."
    section: about

  team:
    title: "DRUŠTVENE MREŽE <br />"
    section: team
    people:
      - name:
        social:
          - url: https://www.instagram.com/eastmountainvilla/
            icon: fab fa-instagram
          - url: https://www.facebook.com/people/East-Mountain-Villa/100086015359963/
            icon: fab fa-facebook-f
          - url: https://www.booking.com/hotel/hr/east-mountain-villa.hr.html
            icon: fas fa-book

  contact:
    title: "Rezervacije i lokacija"
    text: "Za informacije o dostupnosti i rezervacijama, molimo Vas da nas kontaktirate putem e-maila ili telefona."
    section: contact

  footer:
    legal: "Pravila privatnosti"
    social:
      - url: https://www.instagram.com/eastmountainvilla/
        icon: "fab fa-instagram"
      - url: https://www.facebook.com/people/East-Mountain-Villa/100086015359963/
        icon: "fab fa-facebook-f"
      - url: https://www.booking.com/hotel/hr/east-mountain-villa.hr.html
        icon: "fas fa-book"

